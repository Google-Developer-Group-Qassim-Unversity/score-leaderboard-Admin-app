  }
  .hold { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--amber-soft); border-radius: 16px;
    .hold-txt { flex: 1; display: flex; flex-direction: column; gap: 2px; b { font-size: 14.5px; } small { font-size: 12.5px; color: var(--amber-ink); line-height: 1.4; } }
    .bigclock { position: relative; background: var(--amber); color: #0B1230; border-radius: 10px; padding: 9px 10px; font-size: 21px; font-weight: 600; direction: ltr; flex: none; }
    .bigclock::after { content: ""; position: absolute; inset-inline: 0; top: 50%; height: 1px; background: rgb(11 18 48 / .16); }
  }
  .route { list-style: none; margin: 0; padding: 0; position: relative; }
  .route > li { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding-bottom: 18px; }
  .route > li::before { content: ""; position: absolute; inset-inline-start: 15px; top: 18px; bottom: -6px; width: 6px; background: var(--cobalt); border-radius: 3px; }
  .route > li.fut::before { background: var(--hair-2); }
  .route > li.to-green::before { background: color-mix(in srgb, var(--green) 45%, var(--hair-2)); }
  .route > li:last-child::before { display: none; }
  .rs { position: relative; z-index: 1; width: 36px; height: 36px; display: grid; place-items: center; }
  .rs i { width: 22px; height: 22px; border-radius: 50%; background: var(--st-fill); box-shadow: inset 0 0 0 3px var(--st-ring); display: block; }
  .rs.ic i { height: 34px; width: 22px; border-radius: 11px; }
  .rs.term i { box-shadow: inset 0 0 0 4px var(--green); }
  .rs.now i { width: 26px; height: 26px; background: var(--amber); box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--amber); }
  .rs.now::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; border: 2px solid var(--amber); animation: m-pulse 2.2s cubic-bezier(.2,.7,.2,1) infinite; }
  @media (prefers-reduced-motion: reduce) { .rs.now::after { animation: none; opacity: 0; } }
  .rbody { display: flex; flex-direction: column; gap: 2px; padding-top: 7px; min-width: 0;
    b { font-size: 15px; font-weight: 600; }
    small { font-size: 12.5px; color: var(--mute); }
  }
  .route li.fut .rbody b { color: var(--mute); font-weight: 500; }
  .stops { margin-top: 10px; overflow: hidden; }
  .stop { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px;
    & + & { box-shadow: 0 -1px 0 var(--hair); }
    .sring { width: 38px; height: 38px; flex: none; }
    .sring circle { fill: none; stroke-width: 4; }
    .sring .bg { stroke: var(--panel-2); }
    .sring .fg { stroke: var(--cobalt); stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; }
    .sring text { fill: var(--ink); font-size: 10.5px; font-weight: 600; }
    .miss { color: var(--amber-ink); font-weight: 500; }
  }
  .peek { padding: 4px 16px; }
  .peek .kv b { font-size: 14px; font-weight: 500; text-align: end; }
  .peek .kv span { color: var(--mute); }
  .ab-left { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0;
    b { font-size: 13.5px; color: var(--amber-ink); font-weight: 600; }
    a { font-size: 13px; color: var(--cobalt-ink); font-weight: 500; }
  }

  /* inbox */
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
  .chip { appearance: none; border: 0; flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--hair-2); display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 500; cursor: pointer;
    i { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); }
    .n { color: var(--mute); font-variant-numeric: tabular-nums; }
    &[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; .n { color: inherit; opacity: .7; } }
  }
  .task { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .task-head { display: flex; align-items: center; gap: 12px;
    .bmain small { font-size: 12.5px; color: var(--mute); }
  }
  .task h3 { font-size: 18px; line-height: 1.3; }
  .tracks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .trk-chip { border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; font-size: 12px; color: var(--mute); background: var(--panel-2);
    b { font-size: 13px; color: var(--ink); font-weight: 600; display: flex; align-items: center; gap: 6px; }
    b i { width: 8px; height: 8px; border-radius: 50%; }
    &.open b i { background: var(--amber); }
    &.done b i { background: var(--green); }
    &.open { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--amber) 70%, transparent); background: var(--amber-soft); }
  }
  .brief { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin: 0; padding: 12px 0 0; border-top: 1px solid var(--hair);
    dt { color: var(--mute); }
    dd { margin: 0; font-weight: 500; }
  }
  .until { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--mute); svg.lucide { width: 16px; height: 16px; } }
  .task-acts { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .notif { display: flex; gap: 12px; padding: 12px 14px; align-items: flex-start;
    & + & { box-shadow: 0 -1px 0 var(--hair); }
    .aic { width: 34px; height: 34px; }
    .aic.green { background: var(--green-soft); color: var(--green-ink); }
    .ntxt { flex: 1; font-size: 13.5px; color: var(--mute); line-height: 1.45; }
    &.unread .ntxt { color: var(--ink); font-weight: 500; }
    .nmeta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 11.5px; color: var(--mute); flex: none; }
    .udot { width: 8px; height: 8px; border-radius: 50%; background: var(--cobalt); }
  }

  /* ================= DESKTOP ================= */
  .m-desk { display: grid; grid-template-columns: 248px 1fr; min-height: 900px; background: var(--bg); }
  .side { position: sticky; top: 0; height: 900px; display: flex; flex-direction: column; gap: 20px; padding: 20px 14px; background: var(--panel); box-shadow: 1px 0 0 var(--hair);
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 6px; span { display: flex; flex-direction: column; line-height: 1.2; } b { font-size: 15px; font-weight: 600; } small { font-size: 12px; color: var(--mute); } }
  }
  &[dir="rtl"] .side { box-shadow: -1px 0 0 var(--hair); }
  .ngroup { display: flex; flex-direction: column; gap: 2px;
    h4 { margin: 0 0 4px; padding: 0 10px; font-size: 11.5px; font-weight: 600; color: var(--mute); }
    a { display: flex; align-items: center; gap: 11px; min-height: 38px; padding: 0 10px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--mute); transition: background-color .15s, color .15s; }
    a:hover { background: var(--panel-2); color: var(--ink); }
    a.on { background: var(--ink); color: var(--bg); font-weight: 600; }
    a .cnt { margin-inline-start: auto; }
    a.on .cnt { background: rgb(255 255 255 / .16); color: inherit; }
  }
  &[data-theme="dark"] .ngroup a.on .cnt { background: rgb(11 18 48 / .14); }
  .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--panel-2);
    span { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; } b { font-size: 13.5px; } small { font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  }
  .dmain { padding: 0 28px 40px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .dtop { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; height: 68px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); margin: 0 -28px; padding: 0 28px; box-shadow: 0 1px 0 var(--hair);
    h1 { font-size: 20px; margin-inline-end: auto; }
  }
  .search { display: flex; align-items: center; gap: 10px; width: 380px; height: 42px; padding: 0 12px; border-radius: 999px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--hair-2); color: var(--mute); font-size: 13.5px;
    span { flex: 1; }
    kbd { font: 500 11.5px/1 "Readex Pro", system-ui; padding: 4px 7px; border-radius: 6px; background: var(--panel-2); color: var(--mute); direction: ltr; }
  }
  .dmap { padding: 18px 24px 16px; }
  .dmap-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 4px;
    h2 { font-size: 18px; }
    p { margin: 2px 0 0; color: var(--mute); font-size: 13px; }
  }
  .dturn { display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 8px; border-radius: 14px; background: var(--amber-soft);
    .turn-clock { width: auto; padding: 7px 12px; flex-direction: row; gap: 8px; }
    .turn-clock .cd { font-size: 17px; }
    .tt { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; b { font-size: 14.5px; } small { font-size: 12.5px; color: var(--amber-ink); font-weight: 500; } }
  }
  .trains { position: relative; height: 66px; margin-top: 2px; }
  .tcol { position: absolute; top: 0; width: 144px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .tchip { max-width: 142px; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 500; background: var(--panel-2); white-space: nowrap; overflow: hidden;
    i { width: 7px; height: 7px; border-radius: 50%; background: var(--dc); flex: none; }
    span { overflow: hidden; text-overflow: ellipsis; }
    &.amber { background: var(--amber); color: #0B1230; }
    &.scarlet { background: var(--scarlet-flap); color: #fff; }
    &.green { background: var(--green-soft); color: var(--green-ink); }
  }
  .drow { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
  .drow3 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  .dpanel { padding: 16px 0 6px; }
  .dpanel > .sh { padding: 0 18px; }
  .dboard { display: grid; grid-template-columns: 56px minmax(0, 1fr) 150px 170px 104px; }
  .dboard .hd { display: contents; }
  .dboard .hd span { font-size: 11.5px; font-weight: 600; color: var(--mute); padding: 4px 0 8px; border-bottom: 1px solid var(--hair); }
  .dboard .hd span:first-child { padding-inline-start: 18px; }
  .dboard .r { display: contents; }
  .dboard .r > * { display: flex; align-items: center; min-height: 66px; border-bottom: 1px solid var(--hair); min-width: 0; }
  .dboard .r:last-child > * { border-bottom: 0; }
  .dboard .r > :first-child { padding-inline-start: 18px; }
  .dboard .r > :last-child { padding-inline-end: 18px; justify-content: flex-end; }
  .dboard .r .flap { width: 44px; height: 46px; b { font-size: 17px; } }
  .dboard .r .bmain { padding-inline: 14px; flex-direction: column; align-items: flex-start; justify-content: center; }
  .dboard .r:hover > * { background: color-mix(in srgb, var(--panel-2) 50%, transparent); }
  .dboard .hd span:last-child { text-align: end; padding-inline-end: 18px; }
  .dcal { padding: 16px; }
  .dcal .legend { grid-template-columns: 1fr 1fr 1fr; font-size: 11.5px; }
  .dinbox .irow { padding: 11px 16px; }
`;

  /* ---------- screens ---------- */

  const R = (c) => c.data.requests;

  function home(c) {
    const D = c.data;
    const r1 = c.req("r1");
    const mine = R(c).filter((r) => r.mine);
    const map = lineMap(c, { W: 326, H: 132, Y: 70, pad: 24, d: 6, spread: 32, loop: 30, lw: 6, r: 11, fs: 11.5 });
    return `<div class="m-phone">
      ${topBar(c)}
      <main class="m-body">
        <div class="hello"><h1>${c.t("أهلًا " + D.me.name.ar, "Hi " + D.me.name.en)}</h1>
          <p>${c.t(`${c.n(R(c).length)} طلبات على الخط · واحد بانتظارك`, `${c.n(R(c).length)} requests on the line · one waiting on you`)}</p></div>

        <section class="panel turn" aria-labelledby="m-turn">
          <div class="turn-head"><h2 id="m-turn">${c.t("دورك الآن", "Your turn")}</h2><span class="pill amber">${c.L(D.stages.draft)}</span></div>
          <div class="turn-clock"><small>${c.t("ينتهي الحجز بعد", "Hold ends in")}</small>${c.cd(r1.holdMs, "hms")}</div>
          <div class="turn-body">
            <h3>${c.L(r1.title)}</h3>
            <span class="bsub">${deptTag(c, r1.dept, true)}<span class="sep">·</span>${c.range(r1.start, r1.end)}</span>
            <span class="left">${c.icon("list-checks")}${c.t("بقيت ٣ أشياء قبل الإرسال", "3 things left before you can submit")}</span>
          </div>
          <button class="btn block">${c.t("أكمل الطلب", "Continue")}${c.icon("arrow-right", "flip-rtl")}</button>
        </section>

        <section class="panel map-panel" aria-labelledby="m-line">
          ${sectionHead(c, `<span id="m-line">${c.t("خط المسار", "The line")}</span>`, c.t("افتح الخط", "Open"))}
          ${map.svg}
          <div class="map-foot">
            <span><i style="background:var(--cobalt)"></i>${c.t("في الطريق", "Moving")}</span>
            <span><i style="background:var(--amber)"></i>${c.t("بانتظارك", "Your turn")}</span>
            <span><i style="background:var(--scarlet)"></i>${c.t("مُعاد", "Returned")}</span>
            <span><i style="background:var(--green)"></i>${c.t("منشور", "Published")}</span>
          </div>
        </section>

        <section>
          ${sectionHead(c, c.t("طلبات قسمك", "Your department's requests"), c.t("الكل", "All"), mine.length)}
          <div class="panel board">${mine.map((r) => boardRowPhone(c, r)).join("")}</div>
        </section>

        <section>
          ${sectionHead(c, c.t("بانتظار فريقك", "Waiting on your team"), c.t("افتح", "Open"), D.inbox.length)}
          <div class="panel board">${D.inbox.map((i) => inboxRow(c, i)).join("")}</div>
        </section>

        <section>
          ${sectionHead(c, c.t("على المنصة", "On the platform"), c.t("كل الفعاليات", "All events"))}
          <div class="panel board">${D.events.slice(0, 3).map((e) => eventRow(c, e)).join("")}</div>
        </section>

        <section>
          ${sectionHead(c, c.t("يحتاج انتباهك", "Needs your attention"), null, D.attention.length)}
          <div class="panel board">${D.attention.map((a) => attentionRow(c, a)).join("")}</div>
        </section>

        <section>${statsPanel(c)}</section>
      </main>
      <button class="btn book-fab">${c.icon("calendar-plus")}${c.t("احجز موعدًا", "Book dates")}</button>
      ${navBar(c, "home")}
    </div>`;
  }

  function book(c) {
    const D = c.data;
    const depts = ["mobile", "ai", "cyber", "web", "design", "logistics", "media"];
    const closures = [18, 25].map((d) => {
      const day = D.calendar.days[d];
      const iso = `2026-10-${d}`;
      return `<div class="cl">${whenTile(c, iso, "scarlet")}<span class="bmain"><b>${c.L(day.reason)}</b><small>${c.L(D.dayStatus.banned)} · ${c.weekday(iso, "long")}</small></span></div>`;
    });
    return `<div class="m-phone">
      <header class="m-head">
        <button class="icon-btn" aria-label="${c.t("رجوع", "Back")}">${c.icon("arrow-left", "flip-rtl")}</button>
        <span class="ttl"><b>${c.t("احجز موعدًا", "Book dates")}</b><small>${c.t("الخطوة الأولى لكل فعالية", "The first stop of every event")}</small></span>
      </header>
      <main class="m-body" style="gap:16px">
        <p class="hint">${c.icon("info")}<span>${c.t("اضغط أول يوم ثم آخر يوم. نحجزها لك ٢٤ ساعة حتى تُكمل الطلب. أول يوم يمكنك حجزه هو ١٣ أكتوبر.", "Tap the first day, then the last. We hold them for 24 hours while you fill in the request. The first day you can book is 13 Oct.")}</span></p>
        <section class="panel cal-panel">
          <div class="mon">
            <button class="icon-btn" aria-label="${c.t("الشهر السابق", "Previous month")}">${c.icon("chevron-left", "flip-rtl")}</button>
            <h2>${c.date("2026-10-01", { month: "long", year: "numeric" })}</h2>
            <button class="icon-btn" aria-label="${c.t("الشهر التالي", "Next month")}">${c.icon("chevron-right", "flip-rtl")}</button>
          </div>
          ${calendarGrid(c, { sel: [23, 24], wd: "narrow" })}
          ${legend(c)}
        </section>
        <section>
          <p class="lbl">${c.t("أي قسم؟", "Which department?")}</p>
          <div class="depts">${depts
            .map((k, i) => `<button class="dchip" aria-pressed="${i === 0}"><i style="--dc:${c.dept(k).color}"></i>${c.L(c.dept(k))}${i === 0 ? c.icon("check") : ""}</button>`)
            .join("")}</div>
        </section>
        <section>
          <p class="lbl">${c.t("أيام أغلقتها اللوجستيات", "Days Logistics closed")}</p>
          <div class="panel closures">${closures.join("")}</div>
        </section>
      </main>
      <div class="m-actionbar">
        <span class="ab-sum"><b data-m-sum>${c.range("2026-10-23", "2026-10-24")} · ${c.t("يومان", "2 days")}</b><small>${c.t("تطوير التطبيقات · تُحجز ٢٤ ساعة", "Mobile Development · held for 24 hours")}</small></span>
        <button class="btn">${c.t("احجز", "Book")}${c.icon("arrow-right", "flip-rtl")}</button>
      </div>
    </div>`;
  }

  function ring(done, total, c) {
    const C = 2 * Math.PI * 15;
    return `<svg class="sring" viewBox="0 0 38 38" aria-hidden="true"><circle class="bg" cx="19" cy="19" r="15"/><circle class="fg" cx="19" cy="19" r="15" stroke-dasharray="${(C * done) / total} ${C}"/>
      <text x="19" y="19" text-anchor="middle" dominant-baseline="central">${c.n(done)}/${c.n(total)}</text></svg>`;
  }

  function request(c) {
    const D = c.data;
    const r = c.req("r1");
    const det = r.details;
    const modeLab = (m) => (m === "online" ? c.t("عن بُعد", "Online") : c.t("حضوري", "On-site"));
    const stops = r.sections
      .map(
        (s) => `<a class="stop" href="#" onclick="return false">${ring(s.done, s.total, c)}
        <span class="bmain"><b class="btitle">${c.L(s)}</b><small class="miss">${c.t("ناقص: ", "Missing: ")}${s.missing.map((m) => c.L(m)).join("، ")}</small></span>
        ${c.icon("chevron-right", "flip-rtl chev")}</a>`,
      )
      .join("");
    const st = D.steps;
    const li = (i, cls, mark, extra) =>
      `<li class="${cls}"><span class="rs ${mark}"><i></i></span><div class="rbody"><b>${c.L(st[i])}</b><small>${c.L(st[i].hint)}</small>${extra || ""}</div></li>`;
    return `<div class="m-phone">
      <header class="m-head">
        <button class="icon-btn" aria-label="${c.t("رجوع", "Back")}">${c.icon("arrow-left", "flip-rtl")}</button>
        <span class="ttl"><b>${c.t("مسار الفعاليات", "Event pipeline")}</b><small>${c.t("بدأه إبراهيم", "Started by Ibrahim")}</small></span>
        <button class="icon-btn" aria-label="${c.t("خيارات", "Options")}">${c.icon("ellipsis")}</button>
      </header>
      <main class="m-body" style="gap:18px">
        <div class="req-hero">
          <span><span class="pill amber">${c.t("الخطوة ١ من ٥ · مسودة", "Step 1 of 5 · Draft")}</span></span>
          <h1>${c.L(r.title)}</h1>
          <span class="bsub">${deptTag(c, r.dept)}<span class="sep">·</span>${c.range(r.start, r.end)}<span class="sep">·</span>${c.L(r.type)}</span>
        </div>
        <div class="hold">
          <span class="hold-txt"><b>${c.t("الأيام محجوزة", "Dates held")}</b><small>${c.t("أكمل بيانات الفعالية والطلبين ثم أرسل قبل انتهاء الحجز:", "Fill in the event and both briefs, then submit before the hold runs out:")}</small></span>
          <span class="bigclock">${c.cd(r.holdMs, "hms")}</span>
        </div>
        <ol class="route" aria-label="${c.t("سير الطلب", "Progress")}">
          ${li(0, "now", "now", `<div class="panel stops">${stops}</div>`)}
          ${li(1, "fut", "ic")}
          ${li(2, "fut", "")}
          ${li(3, "fut to-green", "")}
          ${li(4, "fut", "term")}
        </ol>
        <section>
          ${sectionHead(c, c.t("بيانات الفعالية", "Event details"), c.t("تعديل", "Edit"))}
          <div class="panel peek">
            <div class="kv"><span>${c.t("اسم المقدّم", "Presenter")}</span><b>${c.L(det.presenter)}</b></div>
            <div class="kv"><span>${c.t("الوقت (كل يوم)", "Time (every day)")}</span><b>${c.L(det.time)}</b></div>
            ${det.modes.map((m) => `<div class="kv"><span>${c.date(m.date, { weekday: "long", day: "numeric", month: "short" })}</span><b>${modeLab(m.mode)}</b></div>`).join("")}
            <div class="kv"><span>${c.t("الفئة المستهدفة", "Audience")}</span><b>${c.L(det.audience)}</b></div>
            <div class="kv"><span>${c.t("التسجيل", "Registration")}</span><b>${c.L(det.registration)} · ${c.n(det.expected)}</b></div>
            <div class="kv"><span>${c.t("بريد المقدّم", "Presenter email")}</span><b class="miss" style="color:var(--amber-ink)">${c.t("ناقص", "Missing")}</b></div>
          </div>
        </section>
      </main>
      <div class="m-actionbar">
        <span class="ab-left"><b>${c.t("بقيت ٣ أشياء قبل الإرسال", "3 things left before you can submit")}</b><a href="#" onclick="return false">${c.t("إكمال لاحقًا", "Finish later")}</a></span>
        <button class="btn" disabled>${c.icon("send", "flip-rtl")}${c.t("إرسال", "Submit")}</button>
      </div>
    </div>`;
  }

  function inbox(c) {
    const D = c.data;
    const first = D.inbox[0];
    const r2 = c.req(first.request);
    const kindIcon = { request_received: ["inbox", "cobalt"], task_done: ["check", "green"], returned: ["corner-up-left", "scarlet"], ready_to_publish: ["flag", "green"], media_received: ["megaphone", "cobalt"] };
    const teams = ["design", "logistics", "media"];
    return `<div class="m-phone">
      ${topBar(c)}
      <main class="m-body" style="gap:16px">
        <div class="hello"><h1>${c.t("بانتظار فريقك", "Waiting on your team")}</h1><p>${c.t("بصفتك مشرفًا عامًا ترى مهام كل الفرق", "As a super admin you see every team's tasks")}</p></div>
        <div class="chips" role="group" aria-label="${c.t("الفريق", "Team")}">
          <button class="chip" aria-pressed="true">${c.t("الكل", "All")} <span class="n">${c.n(3)}</span></button>
          ${teams.map((k) => `<button class="chip" aria-pressed="false" style="--tc:${c.dept(k).color}"><i></i>${c.L(c.dept(k))} <span class="n">${c.n(1)}</span></button>`).join("")}
        </div>
        <article class="panel task">
          <div class="task-head">${teamBadge(c, "design", "lg")}<span class="bmain"><b>${c.t("دور التصميم", "Design's turn")}</b><small>${c.t("وصل ", "Arrived ")}${c.L(first.received)}</small></span><span class="pill amber">${c.t("قيد العمل", "Working on it")}</span></div>
          <h3>${c.L(r2.title)}</h3>
          <span class="bsub">${deptTag(c, r2.dept)}<span class="sep">·</span>${c.range(r2.start, r2.end)}<span class="sep">·</span>${c.L(r2.type)}</span>
          <div class="tracks">
            <span class="trk-chip open"><b><i></i>${c.t("التصميم", "Design")}</b>${c.t("قيد العمل", "Working on it")}</span>
            <span class="trk-chip done"><b><i></i>${c.t("اللوجستيات", "Logistics")}</b>${c.t("تم", "Done")}</span>
          </div>
          <dl class="brief">
            <dt>${c.t("نوع التصميم", "Design type")}</dt><dd>${c.L(first.brief.type)}</dd>
            <dt>${c.t("المقاس", "Size")}</dt><dd>${c.L(first.brief.size)}</dd>
            <dt>${c.t("نوع الملف", "File type")}</dt><dd>${first.brief.file}</dd>
            <dt>${c.t("حالة المحتوى", "Content")}</dt><dd>${c.L(first.brief.content)}</dd>
          </dl>
          <span class="until">${c.icon("clock-3")}${c.t("يمكن إعادته حتى ", "Can be returned until ")}${c.date(first.returnUntil, { day: "numeric", month: "long" })}</span>
          <div class="task-acts">
            <button class="btn">${c.icon("check")}${c.t("إنهاء مهمة التصميم", "Mark Design done")}</button>
            <button class="btn danger">${c.icon("corner-up-left", "flip-rtl")}${c.t("إعادة مع ملاحظات", "Return with notes")}</button>
          </div>
        </article>
        <div class="panel board">${D.inbox.slice(1).map((i) => inboxRow(c, i)).join("")}</div>
        <section>
          ${sectionHead(c, c.t("الإشعارات", "Notifications"), c.t("تعليم الكل كمقروء", "Mark all read"))}
          <div class="panel board">${D.notifications
            .map((n) => {
              const [ic, tone] = kindIcon[n.kind];
              return `<div class="notif ${n.unread ? "unread" : ""}"><span class="aic ${tone}">${c.icon(ic, ic === "corner-up-left" ? "flip-rtl" : "")}</span><span class="ntxt">${c.L(n.text)}</span><span class="nmeta">${c.L(n.ago)}${n.unread ? '<i class="udot"></i>' : ""}</span></div>`;
            })
            .join("")}</div>
        </section>
      </main>
      ${navBar(c, "inbox")}
    </div>`;
  }

  function desktop(c) {
    const D = c.data;
    const r1 = c.req("r1");
    const W = 1072;
    const map = lineMap(c, { W, H: 176, Y: 92, pad: 70, d: 10, spread: 84, loop: 46, lw: 8, r: 15, fs: 13 });
    const at = {
      draft: R(c).filter((r) => r.stage === "draft"),
      in_review: R(c).filter((r) => r.stage === "in_review"),
      media: R(c).filter((r) => r.stage === "media"),
      ready: R(c).filter((r) => r.stage === "ready"),
      published: R(c).filter((r) => r.stage === "published"),
    };
    const chip = (r) => `<span class="tchip ${stateOf(r) === "cobalt" ? "" : stateOf(r)}" title="${c.L(r.title)}"><i style="--dc:${c.dept(r.dept).color}"></i><span>${c.L(r.title)}</span></span>`;
    const cols = ["draft", "in_review", "media", "ready", "published"]
      .map((k, i) => `<div class="tcol" style="left:${((map.xs[i] / W) * 100).toFixed(2)}%">${at[k].map(chip).join("")}</div>`)
      .join("");
    const retCol = `<div class="tcol" style="left:${((map.retX / W) * 100).toFixed(2)}%">${R(c).filter((r) => r.stage === "returned").map(chip).join("")}</div>`;
    const order = ["r1", "r3", "r2", "r4", "r7", "r5", "r6"].map((id) => c.req(id));
    const boardRows = order
      .map((r) => {
        const st = stateOf(r);
        return `<div class="r"><span>${whenTile(c, r.start, st === "cobalt" ? "" : st)}</span>
          <span class="bmain"><b class="btitle">${c.L(r.title)}</b>${miniLine(STEP[r.stage], st)}</span>
          <span class="bsub">${deptTag(c, r.dept)}</span>
          <span><span class="pill ${st}">${whereLabel(c, r)}</span></span>
          <span>${r.holdMs ? `<span class="clock amber">${c.cd(r.holdMs, "hms")}</span>` : r.fixMs ? `<span class="clock scarlet">${c.cd(r.fixMs, "hms")}</span>` : `<span class="bsub">${c.range(r.start, r.end)}</span>`}</span></div>`;
      })
      .join("");
    const nav = D.nav
      .map(
        (g) => `<div class="ngroup"><h4>${c.L(g.group)}</h4>${g.items
          .map((it) => `<a href="#" onclick="return false" class="${it.key === "home" ? "on" : ""}">${c.icon(it.icon)}${c.L(it)}${it.key === "pipeline" ? `<span class="cnt">${c.n(R(c).length)}</span>` : ""}</a>`)
          .join("")}</div>`,
      )
      .join("");
    return `<div class="m-desk">
      <aside class="side">
        <span class="brand">${c.logo(26)}<span><b>${c.t("GDG القصيم", "GDG Qassim")}</b><small>${c.t("لوحة الإدارة", "Admin console")}</small></span></span>
        ${nav}
        <div class="me"><span class="avatar">${c.t("إب", "I")}</span><span><b>${c.L(D.me.name)}</b><small>${c.L(D.me.role)}</small></span></div>
      </aside>
      <main class="dmain">
        <div class="dtop">
          <h1>${c.t("الرئيسية", "Home")}</h1>
          <span class="search">${c.icon("search")}<span>${c.t("ابحث عن فعالية أو عضو أو صفحة…", "Search events, members, pages…")}</span><kbd>⌘K</kbd></span>
          <button class="btn">${c.icon("calendar-plus")}${c.t("احجز موعدًا", "Book dates")}</button>
          <button class="icon-btn" aria-label="${c.t("الإشعارات", "Notifications")}">${c.icon("bell")}<span class="badge">${c.n(3)}</span></button>
        </div>

        <section class="panel dmap" aria-labelledby="d-line">
          <div class="dmap-head">
            <div><h2 id="d-line">${c.t("خط المسار", "The line")}</h2><p>${c.t(`${c.n(R(c).length)} طلبات على الخط الآن، من الحجز حتى النشر`, `${c.n(R(c).length)} requests on the line now, from booking to published`)}</p></div>
            <div class="dturn">
              <span class="turn-clock"><small>${c.t("ينتهي الحجز", "Hold ends")}</small>${c.cd(r1.holdMs, "hms")}</span>
              <span class="tt"><b>${c.t("دورك الآن: ", "Your turn: ")}${c.L(r1.title)}</b><small>${c.t("بقيت ٣ أشياء قبل الإرسال", "3 things left before you can submit")}</small></span>
              <button class="btn sm">${c.t("أكمل الطلب", "Continue")}${c.icon("arrow-right", "flip-rtl")}</button>
            </div>
          </div>
          ${map.svg}
          <div class="trains">${cols}${retCol}</div>
        </section>

        <div class="drow">
          <section class="panel dpanel">
            ${sectionHead(c, c.t("لوحة المغادرة", "Departures"), c.t("مسار الفعاليات", "Event pipeline"), order.length)}
            <div class="dboard">
              <div class="hd"><span>${c.t("اليوم", "Day")}</span><span style="padding-inline-start:14px">${c.t("الطلب", "Request")}</span><span>${c.t("القسم", "Department")}</span><span>${c.t("المحطة", "Station")}</span><span>${c.t("الوقت", "Clock")}</span></div>
              ${boardRows}
            </div>
          </section>
          <div style="display:flex;flex-direction:column;gap:20px">
            <section class="panel dcal">
              <div class="mon">
                <button class="icon-btn" aria-label="${c.t("الشهر السابق", "Previous month")}">${c.icon("chevron-left", "flip-rtl")}</button>
                <h2 style="font-size:16px">${c.date("2026-10-01", { month: "long", year: "numeric" })}</h2>
                <button class="icon-btn" aria-label="${c.t("الشهر التالي", "Next month")}">${c.icon("chevron-right", "flip-rtl")}</button>
              </div>
              ${calendarGrid(c, { sel: [23, 24], wd: "narrow", size: "sm" })}
              ${legend(c)}
            </section>
            <section class="panel dpanel dinbox">
              ${sectionHead(c, c.t("بانتظار فريقك", "Waiting on your team"), c.t("افتح", "Open"), D.inbox.length)}
              ${D.inbox.map((i) => inboxRow(c, i)).join("")}
            </section>
          </div>
        </div>

        <div class="drow3">
          <section class="panel dpanel">
            ${sectionHead(c, c.t("على المنصة", "On the platform"), c.t("كل الفعاليات", "All events"))}
            ${D.events.map((e) => eventRow(c, e)).join("")}
          </section>
          <section class="panel dpanel">
            ${sectionHead(c, c.t("يحتاج انتباهك", "Needs your attention"), null, D.attention.length)}
            ${D.attention.map((a) => attentionRow(c, a)).join("")}
          </section>
          <section>${statsPanel(c)}</section>
        </div>
      </main>
    </div>`;
  }

  /** Tap two open days to pick a range; tap a chip to filter. Purely visual. */
  function after(root, c) {
    root.querySelectorAll(".d-metro .cal-grid").forEach((grid) => {
      let a = 23, b = 24;
      const paint = () => {
        grid.querySelectorAll(".day").forEach((el) => {
          const d = +el.dataset.day;
          const on = b ? d >= a && d <= b : d === a;
          el.classList.toggle("sel", on);
          el.classList.toggle("sel-a", d === a);
          el.classList.toggle("sel-b", d === (b || a));
          el.setAttribute("aria-pressed", on);
        });
        const sum = grid.closest(".screen, .desk-screen")?.querySelector("[data-m-sum]");
        if (sum) {
          const iso = (d) => `2026-10-${String(d).padStart(2, "0")}`;
          const n = b ? b - a + 1 : 1;
          sum.textContent = `${c.range(iso(a), iso(b || a))} · ${c.lang === "ar" ? (n === 1 ? "يوم واحد" : n === 2 ? "يومان" : `${c.n(n)} أيام`) : `${n} day${n > 1 ? "s" : ""}`}`;
        }
      };
      grid.addEventListener("click", (e) => {
        const el = e.target.closest(".day.open, .day.sel");
        if (!el) return;
        const d = +el.dataset.day;
        if (b || d < a) { a = d; b = null; }
        else {
          let ok = true;
          for (let x = a; x <= d; x++) if (c.data.calendar.days[x].status !== "open") ok = false;
          if (ok && d - a < 5) b = d; else { a = d; b = null; }
        }
        paint();
      });
    });
    root.querySelectorAll(".d-metro .chips, .d-metro .depts").forEach((g) => {
      g.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === btn));
      });
    });
  }

  (window.GDG_DESIGNS = window.GDG_DESIGNS || []).push({
    id: "metro",
    order: 2,
    meta: {
      name: { ar: "خط المترو", en: "Metro Line" },
      tagline: { ar: "كل طلب قطار على خط واحد", en: "Every request is a train on one line" },
      badge: { ar: "أقوى منافس", en: "Strongest challenger" },
      thesis: {
        ar: "مسار الفعاليات مرسوم كخريطة مترو الرياض: المحطات هي خطوات الطلب (مسودة ← التصميم واللوجستيات ← الإعلام ← جاهز ← منشور)، والتصميم واللوجستيات محطة تبادل يمشي فيها مساران متوازيان ثم يلتقيان، و«مُعاد» حلقة حمراء ترجع للخلف. كل طلب قطار واقف عند محطته، والرئيسية تبدأ بالخط نفسه وعدد الطلبات عند كل محطة. ألوان Google الأربعة صارت أحبار الخطوط.",
        en: "The pipeline drawn as a Riyadh Metro map: stations are the request's steps (Draft → Design & Logistics → Media → Ready → Published), Design & Logistics is an interchange where two parallel tracks merge, and Returned is a red loop running back. Each request is a train at its station, and home opens on the live line with a count at every stop. Google's four colours become the line inks.",
      },
      palette: [
        { name: { ar: "مينا منتصف الليل", en: "Midnight enamel" }, hex: "#0B1230" },
        { name: { ar: "خزف", en: "Porcelain" }, hex: "#F3F4F1" },
        { name: { ar: "كوبالت · في الطريق", en: "Cobalt · moving" }, hex: "#3F7BF5" },
        { name: { ar: "كهرماني · دورك", en: "Amber · your turn" }, hex: "#F9B814" },
        { name: { ar: "قرمزي · مُعاد", en: "Scarlet · returned" }, hex: "#E8453C" },
        { name: { ar: "أخضر · منشور", en: "Green · published" }, hex: "#2BA65A" },
      ],
      swatch: "#3F7BF5",
      type: { ar: "Readex Pro لكل شيء: حروف لوحات المحطات، واضحة بالعربي والإنجليزي، وأرقام جدولية للأوقات.", en: "Readex Pro throughout: station-sign lettering, clear in Arabic and English, tabular figures for clocks." },
      nav: { ar: "شريط سفلي مثل تطبيقات النقل (الرئيسية، الخط، الفعاليات، بانتظارك، المزيد) وزر «احجز موعدًا» عائم. على الشاشة الكبيرة قائمة جانبية بمجموعات التطبيق.", en: "A transit-app bottom bar (Home, Line, Events, For you, More) with a floating Book dates pill. On desktop, a sidebar with the app's nav groups." },
      why: { ar: "خطوط مترو الرياض الملونة صارت جزءًا من لغة كل طالب، والمسار فعلًا خط بمحطات ومحطة تبادل، وألوان GDG الأربعة تصير أحبار الخطوط بمعنى ثابت.", en: "Riyadh Metro's coloured lines are part of every Saudi student's daily vocabulary, the pipeline literally is a line with stations and an interchange, and the four GDG colours become line inks with fixed meanings." },
      risk: { ar: "المينا الداكنة جميلة بالليل لكنها ثقيلة في النهار، فلازم الوضع الفاتح (الخزف) يقوم بنفسه. واستعارة الخريطة تحتاج انضباطًا صارمًا في التسميات على جوال عرضه ٣٩٠ وفي الاتجاه من اليمين لليسار.", en: "The midnight enamel is beautiful at night but heavy in daylight, so the porcelain light theme has to stand on its own; a map metaphor needs strict label discipline on a 390px phone and in RTL." },
      raises: [
        { ar: "من لوحة المغادرة المتقلبة: لوحة «المغادرة» بأعمدة ثابتة (اليوم · الطلب · القسم · المحطة · الوقت)؛ الحالة تلوّن خانة اليوم فقط (كهرماني، قرمزي، أخضر) بدون ما تكسر الشبكة، والعدّاد في خانة ثابتة بخط منتصف مثل الألواح.", en: "From the split-flap board: a Departures board with fixed columns (day · request · department · station · clock); state recolours only the day flap (amber, scarlet, green) without breaking the grid, and countdowns sit in fixed split cells." },
      ],
      fonts: ["Readex+Pro:wght@300;400;500;600;700"],
    },
    css,
    phone: { home, book, request, inbox },
    desktop,
    after,
  });
})();

</script>
<script>
/* d3-pocket.js */
/*
 * Design 3: Pocket / في الجيب
 * A friendly phone app first: soft cards on a warm blush ground, plain human
 * labels, and ONE saturated colour (blue) reserved for what can be pressed.
 * State colours come from a single mapping (TONE below) and nothing else.
 */
(function () {
  /* ---------- the one state mapping ---------- */
  // done = sage, wait = honey (waiting on someone / your turn), ret = clay (returned / overdue), info = slate
  const STAGE_TONE = { draft: "wait", in_review: "info", returned: "ret", media: "info", ready: "wait", published: "done", cancelled: "mute" };
  const ATTN_TONE = { red: "ret", yellow: "wait", blue: "info", green: "done" };
  const TEAM_ICON = { design: "palette", logistics: "truck", media: "megaphone" };
  const NOTE_ICON = { request_received: "inbox", task_done: "circle-check", returned: "corner-up-left", ready_to_publish: "send", media_received: "megaphone", dates_banned: "calendar-x", hold_expired: "timer-off" };
  const NOTE_TONE = { returned: "ret", task_done: "done", ready_to_publish: "done" };

  const fwd = (c) => c.icon("chevron-right", "flip-rtl pk-chev");

  /* ---------- shared pieces ---------- */

  /** The 5-stop progress, identical everywhere a request appears. */
  function prog(c, stage, opts) {
    const o = opts || {};
    const S = c.data.steps;
    const cur = c.data.stages[stage].step;
    const allDone = stage === "published";
    const tone = STAGE_TONE[stage];
    const stops = S.map((s, i) => {
      const done = allDone || i < cur;
      const isCur = !allDone && i === cur;
      const reached = allDone || i <= cur;
      const cls = done ? "done" : isCur ? `cur t-${tone}` : "todo";
      const label = o.labels ? `<span class="pk-stop-l">${c.L(s)}</span>` : "";
      const inner = done && o.labels ? c.icon("check") : "";
      return `<span class="pk-stop ${cls} ${i > 0 ? (reached ? "ln-on" : "ln-off") : ""}"><span class="pk-dot">${inner}</span>${label}</span>`;
    }).join("");
    const aria = allDone
      ? c.t("اكتملت كل الخطوات", "All steps done")
      : c.t(`الخطوة ${c.n(cur + 1)} من ${c.n(5)}: ${c.L(S[cur])}`, `Step ${cur + 1} of 5: ${c.L(S[cur])}`);
    return `<div class="pk-prog ${o.labels ? "lg" : ""}" role="img" aria-label="${aria}">${stops}</div>`;
  }

  /** Same component, carrying club-wide counts per stop. */
  function progCounts(c, counts) {
    const S = c.data.steps;
    const stops = S.map((s, i) => {
      const n = counts[i];
      return `<span class="pk-stop cnt ${n ? "has" : "none"} ${i > 0 ? "ln-off" : ""}"><span class="pk-dot">${c.n(n)}</span><span class="pk-stop-l">${c.L(s)}</span></span>`;
    }).join("");
    return `<div class="pk-prog lg counts" role="list">${stops}</div>`;
  }

  const stageText = (c, stage) => `<span class="pk-state t-${STAGE_TONE[stage]}"><i class="pk-sdot"></i>${c.L(c.data.stages[stage])}</span>`;

  function topbar(c, { title, back, bell = true } = {}) {
    const start = back
      ? `<button class="pk-iconbtn pk-press" aria-label="${c.t("رجوع", "Back")}">${c.icon("arrow-left", "flip-rtl")}</button><span class="pk-tb-title">${title}</span>`
      : `<span class="pk-brand">${c.logo(22)}<span>${c.t("GDG القصيم", "GDG Qassim")}</span></span>`;
    const end = bell
      ? `<button class="pk-iconbtn pk-press pk-bell" aria-label="${c.t("الإشعارات، ٣ جديدة", "Notifications, 3 new")}">${c.icon("bell")}<b>${c.n(3)}</b></button>
         <span class="pk-avatar" role="img" aria-label="${c.L(c.data.me.name)}">${c.icon("user-round")}</span>`
      : `<button class="pk-iconbtn pk-press" aria-label="${c.t("خيارات", "Options")}">${c.icon("ellipsis")}</button>`;
    return `<header class="pk-top"><div class="pk-top-s">${start}</div><div class="pk-top-e">${end}</div></header>`;
  }

  function bottomnav(c, active) {
    const item = (key, icon, ar, en) =>
      `<a class="pk-nav-i pk-press ${active === key ? "on" : ""}" ${active === key ? 'aria-current="page"' : ""} href="#">${c.icon(icon)}<span>${c.t(ar, en)}</span></a>`;
    return `<nav class="pk-nav" aria-label="${c.t("التنقل", "Navigation")}">
      ${item("home", "house", "الرئيسية", "Home")}
      ${item("requests", "route", "الطلبات", "Requests")}
      <a class="pk-nav-add pk-press" href="#" aria-label="${c.t("احجز موعدًا", "Book dates")}">${c.icon("plus")}</a>
      ${item("events", "calendar-days", "الفعاليات", "Events")}
      ${item("more", "layout-grid", "المزيد", "More")}
    </nav>`;
  }

  function requestRow(c, r) {
    const d = c.dept(r.dept);
    const dates = r.start ? c.range(r.start, r.end) : c.t("بلا تواريخ", "No dates");
    return `<a class="pk-req pk-press" href="#">
      <span class="pk-req-main">
        <span class="pk-req-t">${c.L(r.title)}</span>
        <span class="pk-req-m">${c.L(d.short)} · ${dates}</span>
        ${prog(c, r.stage)}
      </span>
      <span class="pk-req-e">${stageText(c, r.stage)}${fwd(c)}</span>
    </a>`;
  }

  function inboxRow(c, item) {
    const r = c.req(item.request);
    return `<a class="pk-row pk-press" href="#" data-team="${item.team}">
      <span class="pk-ico">${c.icon(TEAM_ICON[item.team])}</span>
      <span class="pk-row-main"><span class="pk-row-t">${c.L(r.title)}</span>
      <span class="pk-row-m">${c.L(c.dept(item.team))} · ${c.L(item.received)}</span></span>
      ${fwd(c)}
    </a>`;
  }

  function yourTurn(c, { desk } = {}) {
    const r = c.req("r1");
    const missing = r.sections.flatMap((s) => s.missing);
    return `<section class="pk-card pk-turn ${desk ? "desk" : ""}" aria-labelledby="pk-turn-h">
      <div class="pk-turn-head">
        <span class="pk-state t-wait"><i class="pk-sdot"></i>${c.t("دورك الحين", "Your turn")}</span>

  /** October 2026. sel = [start, end] day numbers. */
  function calendar(c, { sel = [], compact = false } = {}) {
    const cal = c.data.calendar;
    const heads = [4, 5, 6, 7, 8, 9, 10].map((d) => `<span class="pk-wd">${c.weekday(`2026-10-${String(d).padStart(2, "0")}`, "short")}</span>`).join("");
    const lead = new Date(Date.UTC(2026, 9, 1)).getUTCDay();
    let cells = "";
    for (let i = 0; i < lead; i++) cells += `<span></span>`;
    const [a, b] = sel;
    for (let d = 1; d <= 31; d++) {
      const day = cal.days[d];
      const iso = `2026-10-${String(d).padStart(2, "0")}`;
      const inSel = a && d >= a && d <= (b || a);
      const selCls = inSel ? ` sel${d === a ? " sel-a" : ""}${d === (b || a) ? " sel-b" : ""}` : "";
      const reason = day.reason ? ` · ${c.L(day.reason)}` : "";
      const label = `${c.date(iso, { day: "numeric", month: "long" })} · ${c.L(c.data.dayStatus[day.status])}${reason}`;
      const dis = day.status !== "open" ? " disabled" : "";
      cells += `<button class="pk-day s-${day.status}${selCls}${iso === cal.today ? " today" : ""}" data-d="${d}" aria-label="${label}" title="${label}"${dis}${inSel ? ' aria-pressed="true"' : ""}><span>${c.n(d)}</span>${["booked", "held", "published"].includes(day.status) ? '<i class="pk-cdot"></i>' : ""}</button>`;
    }
    return `<div class="pk-cal ${compact ? "compact" : ""}">${heads}${cells}</div>`;
  }

  function legend(c) {
    const order = ["open", "held", "booked", "published", "banned", "locked"];
    return `<div class="pk-legend">${order.map((s) => `<span><i class="pk-sw s-${s}"></i>${c.L(c.data.dayStatus[s])}</span>`).join("")}</div>`;
  }

  const dayCount = (c, n) => c.lang === "ar"

  function after(root, c) {
    root.querySelectorAll(".d-pocket [data-pk-inbox]").forEach((scr) => {
      scr.addEventListener("click", (e) => {
        const b = e.target.closest("[data-pk-filter]");
        if (!b) return;
        const f = b.dataset.pkFilter;
        scr.querySelectorAll("[data-pk-filter]").forEach((x) => x.setAttribute("aria-pressed", x === b));
        scr.querySelectorAll(".pk-main [data-team]").forEach((el) => { el.hidden = f !== "all" && el.dataset.team !== f; });
        scr.querySelectorAll(".pk-list").forEach((l) => { if (l.querySelector("[data-team]")) l.hidden = ![...l.children].some((ch) => !ch.hidden); });
      });
    });
    root.querySelectorAll(".d-pocket [data-pk-book]").forEach((scr) => {
      let a = 23, b = 24;
      const days = c.data.calendar.days;
      const paint = () => {
        scr.querySelectorAll(".pk-day[data-d]").forEach((el) => {
          const d = +el.dataset.d;
          const on = a && d >= a && d <= (b || a);
          el.classList.toggle("sel", !!on);
          el.classList.toggle("sel-a", d === a);
          el.classList.toggle("sel-b", d === (b || a));
          if (on) el.setAttribute("aria-pressed", "true"); else el.removeAttribute("aria-pressed");
        });
        const sum = scr.querySelector("[data-pk-sum]");
        const iso = (d) => `2026-10-${String(d).padStart(2, "0")}`;
        if (sum) sum.textContent = `${c.range(iso(a), iso(b || a))} · ${dayCount(c, (b || a) - a + 1)}`;
      };
      scr.addEventListener("click", (e) => {
        const el = e.target.closest(".pk-day[data-d]");
        if (!el || el.disabled) return;
        const d = +el.dataset.d;
        if (!a || b || d < a) { a = d; b = null; }
        else {
          let ok = true;
          for (let x = a; x <= d; x++) if (days[x].status !== "open") ok = false;
          if (ok) b = d; else { a = d; b = null; }
        }
        paint();
      });
    });
  }

<script>
/* d4-tonal.js */
/*
 * Design 4 — Google Tonal (Material 3).
 * Tonal surfaces seeded from GDG blue, Google Calendar's grammar for booking,
 * navigation bar + extended FAB on phones, navigation rail on desktop.
 * Colour means state only: blue open/info, green done/live, yellow waiting on
 * someone (your turn), red returned/overdue. Department colour is identity and
 * appears only as calendar chips and small avatars.
 */
(function () {
  const ID = "tonal";

  /* ---------- helpers ---------- */

  /** The state colour of a request: y = your turn, r = returned, g = done, b = in progress elsewhere. */
  function tone(r) {
    if (r.stage === "returned") return "r";
    if (r.stage === "published") return "g";
    if (r.whoseTurn === "you") return "y";
    return "b";
  }

  const LIGHT_DEPTS = new Set(["web", "logistics", "media"]);

  function av(c, key, size, cls) {
    const d = c.dept(key);
    return `<span class="av ${cls || ""}" style="--dc:${d.color};--sz:${size || 40}px" aria-hidden="true">${c.icon(d.icon)}</span>`;
  }

  function dayCount(c, n) {
    if (c.lang === "en") return n === 1 ? "1 day" : `${n} days`;
    if (n === 1) return "يوم واحد";
    if (n === 2) return "يومان";
    if (n <= 10) return `${c.n(n)} أيام`;
    return `${c.n(n)} يومًا`;
  }

  function thingsLeft(c, n) {
    if (c.lang === "en") return n === 1 ? "1 thing left before you can submit" : `${n} things left before you can submit`;
    if (n === 1) return "بقي شيء واحد قبل الإرسال";
    if (n === 2) return "بقي شيئان قبل الإرسال";
    return `بقيت ${c.n(n)} أشياء قبل الإرسال`;
  }

  /**
   * The ONE progress component. Five stations on a track; done = green,
   * current ringed in the request's state colour, returned red, upcoming outline.
   * size: "s" (list rows) | "l" (labelled). counts: club-wide totals per station.
   */
  function stepper(c, r, size, counts) {
    const steps = c.data.steps;
    let html = "";
    if (counts) {
      html = steps
        .map((s, i) => {
          const n = counts[s.key] || 0;
          const ret = s.key === "in_review" ? counts.returned || 0 : 0;
          return `<li class="st st-cnt${n ? "" : " st-zero"}"><span class="dot"><span class="tab">${c.n(n)}</span>${ret ? `<span class="rbadge" title="${c.t("مُعاد", "Returned")}">${c.n(ret)}</span>` : ""}</span><span class="lbl">${c.L(s)}</span>${ret ? `<span class="lbl-sub">${c.t(`منها ${c.n(ret)} مُعاد`, `${ret} returned`)}</span>` : ""}</li>`;
        })
        .join("");
      return `<ol class="stp stp-l stp-c" aria-label="${c.t("المسار في النادي", "Across the club")}">${html}</ol>`;
    }
    const cur = c.data.stages[r.stage].step;
    const published = r.stage === "published";
    const returned = r.stage === "returned";
    const t = tone(r);
    html = steps
      .map((s, i) => {
        const state = published || i < cur ? "done" : i === cur ? (returned ? "ret" : "cur") : "todo";
        const linkDone = published || i <= cur;
        let inner = "";
        if (size === "l") {
          inner = state === "done" ? c.icon("check") : state === "ret" ? c.icon("corner-up-left", "flip-rtl") : `<span class="tab">${c.n(i + 1)}</span>`;
        }
        return `<li class="st st-${state}${linkDone ? " lk" : ""}" ${state === "cur" || state === "ret" ? 'aria-current="step"' : ""}><span class="dot">${inner}</span>${size === "l" ? `<span class="lbl">${c.L(s)}</span>` : ""}</li>`;
      })
      .join("");
    const label = c.t(`الخطوة ${c.n(Math.max(cur, 0) + 1)} من ٥`, `Step ${Math.max(cur, 0) + 1} of 5`);
    return `<ol class="stp stp-${size || "s"} t-${t}" aria-label="${label}">${html}</ol>`;
  }

  function stageChip(c, r) {

  function dateTile(c, iso) {

  function navbar(c, active, fab) {

      <div class="nb-in">${items
        .map(

  function searchBar(c) {

  /** Your turn: the request that needs the signed-in person now. */
  function turnCard(c, cls) {
    const r = c.req("r1");
    const missing = r.sections.flatMap((s) => s.missing);
    return `<section class="turn ${cls || ""}" aria-labelledby="turn-${cls || "p"}">
      <div class="turn-top">
        <span class="sc t-y">${c.icon("hand")}${c.t("دورك", "Your turn")}</span>

      <h3 id="turn-${cls || "p"}">${c.L(r.title)}</h3>
      <div class="turn-meta">${av(c, r.dept, 24)}<span>${c.L(c.dept(r.dept))}</span><span class="sep">·</span><span class="tab">${c.range(r.start, r.end)}</span></div>

  function myRequestRows(c) {
    return c.data.requests
      .filter((r) => r.mine)

  function inboxRows(c) {
    return c.data.inbox

  function stageCounts(c) {
    const out = { returned: 0 };
    c.data.requests.forEach((r) => {
      if (r.stage === "returned") out.returned++;
      const key = r.stage === "returned" ? "in_review" : r.stage;
      out[key] = (out[key] || 0) + 1;
    });
    return out;
  }

  const EVENT_TONE = { active: "g", open: "b", draft: "n", closed: "n" };
  const EVENT_LABEL = {
    active: { ar: "شغالة الحين", en: "Running now" },
    open: { ar: "التسجيل مفتوح", en: "Registration open" },

  function eventRows(c) {
    return c.data.events
      .map((e) => {
        const metric =
          e.attended != null
            ? c.t(`${c.n(e.attended)} حضروا`, `${c.n(e.attended)} attended`)

              ? c.t(`${c.n(e.responses)} تسجيل`, `${c.n(e.responses)} responses`)
              : c.L(e.next);
        return `<button type="button" class="row">
          ${av(c, e.dept, 40)}
          <span class="row-m">
            <span class="row-t">${c.L(e.title)}</span>
            <span class="row-s"><span class="sc t-${EVENT_TONE[e.status]} sm">${e.status === "active" ? '<span class="live"></span>' : ""}${c.L(EVENT_LABEL[e.status])}</span><span>${c.L(e.when)}</span><span class="sep">·</span><span class="tab">${metric}</span></span>
          </span>
          ${c.icon("chevron-right", "flip-rtl chev")}
        </button>`;
      })
      .join("");

  const ATT_ICON = { red: "triangle-alert", yellow: "award", blue: "calendar-clock" };
  const ATT_TONE = { red: "r", yellow: "y", blue: "b" };
  function attentionRows(c) {
    return c.data.attention
      .map(
        (a) => `<div class="row row-static">
        <span class="ti t-${ATT_TONE[a.tone]}">${c.icon(ATT_ICON[a.tone])}</span>
        <span class="row-m">
          <span class="row-t">${c.L(a.title)}</span>
          <span class="row-s"><span>${c.L(a.event)}</span><span class="sep">·</span><span>${c.L(a.detail)}</span></span>
        </span>

      </div>`,
      )
      .join("");

  function statsGrid(c) {
    const s = c.data.stats;
    const cells = [
      { l: { ar: "التسجيل مفتوح", en: "Open for registration" }, v: c.n(s.open), h: { ar: "الأعضاء يقدرون يسجلون", en: "Members can still sign up" } },
      { l: { ar: "شغالة الحين", en: "Running now" }, v: c.n(s.live), h: { ar: "ورشة Git و GitHub", en: "Git & GitHub workshop" } },
      { l: { ar: "الأعضاء", en: "Members" }, v: c.n(s.members), h: { ar: `${c.n(s.verified)} موثّق · ${c.n(s.pending)} بانتظار التوثيق`, en: `${c.n(s.verified)} verified · ${c.n(s.pending)} pending` } },
      { l: { ar: "الرسائل المرسلة (٢٤ ساعة)", en: "Emails sent (24h)" }, v: c.n(s.emails24h), h: { ar: "من كل المزوّدين", en: "Across every provider" } },
    ];
    return cells.map((x) => `<div class="stat"><span class="stat-l">${c.L(x.l)}</span><span class="stat-v tab">${x.v}</span><span class="stat-h">${c.L(x.h)}</span></div>`).join("");
  }

  function sectionHead(c, ar, en, action, id) {
    return `<div class="sh"><h2 ${id ? `id="${id}"` : ""}>${c.t(ar, en)}</h2>${action ? `<button type="button" class="btn btn-t sm">${c.L(action)}</button>` : ""}</div>`;
  }

  const ALL = { ar: "عرض الكل", en: "See all" };

  /* ---------- the phone calendar ---------- */

  function phoneMonth(c, sel) {
    const cal = c.data.calendar;
    const heads = [4, 5, 6, 7, 8, 9, 10].map((d) => `<span class="wd">${c.weekday(`2026-10-${String(d).padStart(2, "0")}`, "narrow")}</span>`).join("");
    let cells = "";
    for (let i = 0; i < 4; i++) cells += `<span class="cday blank" aria-hidden="true"></span>`;
    for (let d = 1; d <= 31; d++) {
      const day = cal.days[d];
      const iso = `2026-10-${String(d).padStart(2, "0")}`;
      const s = day.status;
      let selc = "";
      if (sel && d >= sel[0] && d <= sel[1]) selc = sel[0] === sel[1] ? " sel-one" : d === sel[0] ? " sel-a" : d === sel[1] ? " sel-b" : " sel-m";
      const r = day.request ? c.req(day.request) : null;
      const label = `${c.date(iso, { day: "numeric", month: "long" })}: ${c.L(c.data.dayStatus[s])}${day.reason ? ` (${c.L(day.reason)})` : ""}${r ? ` · ${c.L(r.title)}` : ""}`;
      const mk = s === "booked" || s === "published" ? `<span class="mk" style="--dc:${c.dept(r.dept).color}"></span>` : "";
      cells += `<button type="button" class="cday s-${s}${selc}${iso === cal.today ? " today" : ""}" data-d="${d}" aria-label="${label}" ${s === "open" ? "" : "disabled"} ${selc ? 'aria-pressed="true"' : ""}><span class="num tab">${c.n(d)}</span>${mk}</button>`;
    }
    return `<div class="month" role="grid"><div class="wds">${heads}</div><div class="days">${cells}</div></div>`;
  }

  function legend(c) {
    const order = ["open", "locked", "banned", "held", "booked", "published"];
    return `<ul class="legend">${order
      .map((k) => `<li><span class="lg-sw s-${k}"><span class="num tab">${c.n(k === "locked" ? 9 : 7)}</span>${k === "booked" || k === "published" ? '<span class="mk"></span>' : ""}</span>${c.L(c.data.dayStatus[k])}</li>`)
      .join("")}</ul>`;
  }

  /* ---------- desktop calendar ---------- */

  function deskMonth(c) {
    const cal = c.data.calendar;
    const weeks = [];
    // Sun 27 Sep … Sat 31 Oct, five rows.
    const days = [];
    for (let d = 27; d <= 30; d++) days.push({ iso: `2026-09-${d}`, d, out: true });
    for (let d = 1; d <= 31; d++) days.push({ iso: `2026-10-${String(d).padStart(2, "0")}`, d, out: false });
    for (let w = 0; w < 5; w++) weeks.push(days.slice(w * 7, w * 7 + 7));

    // Bookings as spans: [first day, last day, request]
    const spans = [];
    const seen = new Set();
    for (let d = 1; d <= 31; d++) {
      const day = cal.days[d];
      if (day.request && !seen.has(day.request)) {
        seen.add(day.request);
        let e = d;
        while (e < 31 && cal.days[e + 1].request === day.request) e++;
        spans.push({ a: d, b: e, r: c.req(day.request), status: day.status });
      }
    }
    const heads = weeks[1].map((x) => `<div class="dwh">${c.weekday(x.iso, "short")}</div>`).join("");

    const rows = weeks
      .map((wk) => {
        const cells = wk
          .map((x, i) => {
            const day = x.out ? { status: "locked" } : cal.days[x.d];
            const isToday = x.iso === cal.today;
            const numTxt = x.d === 1 && !x.out ? c.date(x.iso, { day: "numeric", month: "short" }) : c.n(x.d);
            return `<div class="dc s-${day.status}${x.out ? " out" : ""}" style="grid-column:${i + 1}">
              <span class="dn${isToday ? " today" : ""} tab">${numTxt}</span>
              ${day.status === "open" ? `<button type="button" class="dc-add" aria-label="${c.t("احجز", "Book")} ${c.date(x.iso)}">${c.icon("plus")}</button>` : ""}
            </div>`;
          })
          .join("");
        let extras = "";
        wk.forEach((x, i) => {
          if (x.out) return;
          const day = cal.days[x.d];
          if (day.status === "banned") {
            extras += `<div class="dban" style="grid-column:${i + 1}">${c.icon("ban")}<span>${c.L(day.reason)}</span></div>`;
          }
          if (x.iso === cal.firstBookable) {
            extras += `<div class="dfirst" style="grid-column:${i + 1}">${c.t("أول يوم متاح", "First bookable")}</div>`;
          }
        });
        const chips = spans
          .filter((s) => wk.some((x) => !x.out && x.d === s.a))
          .map((s) => {
            const col = wk.findIndex((x) => !x.out && x.d === s.a) + 1;
            const span = s.b - s.a + 1;
            const d = c.dept(s.r.dept);
            const ic = s.status === "held" ? "clock-3" : s.r.stage === "returned" ? "corner-up-left" : s.status === "published" ? "circle-check" : "";
            const kind = s.status === "held" ? "held" : "solid";
            return `<button type="button" class="dchip k-${kind}${LIGHT_DEPTS.has(s.r.dept) ? " lt" : ""}" style="grid-column:${col} / span ${span};--dc:${d.color}" title="${c.L(s.r.title)} · ${c.L(c.data.stages[s.r.stage])}">
              ${ic ? c.icon(ic, ic === "corner-up-left" ? "flip-rtl" : "") : ""}<span class="dchip-t">${c.L(s.r.title)}</span>${span > 1 ? `<span class="dchip-s">${c.L(d.short)}</span>` : ""}</button>`;
          })
          .join("");
        return `<div class="dwk">${cells}${extras}${chips}</div>`;
      })
      .join("");
    return `<div class="dmonth"><div class="dwhs">${heads}</div>${rows}</div>`;
  }

  function deskLegend(c) {
    return `<div class="dleg">
      <span><i class="lgk k-solid" style="--dc:#34A853"></i>${c.t("محجوز", "Booked")}</span>
      <span><i class="lgk k-held" style="--dc:#34A853"></i>${c.t("محجوز مؤقتًا", "Held (draft)")}</span>

      <span class="r">${c.icon("ban")}${c.t("مغلق", "Closed")}</span>

    </div>`;
  }

  /* ---------- CSS ---------- */

  const css = `
.d-tonal {

  --r:#B3261E; --rc:#F9DEDC; --onr:#410E0B; --rdot:#EA4335;

}

  --s:#131314; --s0:#0E0E0F; --s1:#1B1B1C; --s2:#1E1F20; --s3:#282A2C; --card:#1E1F20;
  --on:#E3E3E3; --onv:#C4C7C5; --ol:#8E918F; --olv:#444746;
  --g:#6DD58C; --gc:#0F5223; --ong:#C4EED0; --gdot:#6DD58C;
  --yi:#FDD663; --yc:#5C4300; --ony:#FFE08A; --ydot:#FDD663; --ysoft:#262113;
  --r:#F2B8B5; --rc:#8C1D18; --onr:#F9DEDC; --rdot:#F28B82;
  --n:#C4C7C5; --nc:#333537;
  --sb:#E3E3E3; --sb-bg:#131314;
  --sh1:0 1px 2px rgb(0 0 0 / .5), 0 1px 3px 1px rgb(0 0 0 / .3);

}

/* state layer: hover 8%, pressed 12% of the content colour */
.d-tonal .btn, .d-tonal .row, .d-tonal .ib, .d-tonal .nbi .pill, .d-tonal .fab, .d-tonal .chip, .d-tonal .cday, .d-tonal .rli, .d-tonal .dchip, .d-tonal .dc-add, .d-tonal .seg button, .d-tonal .field { position: relative; isolation: isolate; }
.d-tonal .btn::after, .d-tonal .row::after, .d-tonal .ib::after, .d-tonal .nbi .pill::after, .d-tonal .fab::after, .d-tonal .chip::after, .d-tonal .cday:not(:disabled)::after, .d-tonal .rli::after, .d-tonal .dchip::after, .d-tonal .dc-add::after, .d-tonal .seg button::after, .d-tonal .field::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: -1;
}
.d-tonal .btn:hover::after, .d-tonal .row:hover::after, .d-tonal .ib:hover::after, .d-tonal .nbi:hover .pill::after, .d-tonal .fab:hover::after, .d-tonal .chip:hover::after, .d-tonal .cday:not(:disabled):hover::after, .d-tonal .rli:hover::after, .d-tonal .dchip:hover::after, .d-tonal .dc-add:hover::after, .d-tonal .seg button:hover::after, .d-tonal .field:hover::after { opacity: .08; }
.d-tonal .btn:active::after, .d-tonal .row:active::after, .d-tonal .ib:active::after, .d-tonal .nbi:active .pill::after, .d-tonal .fab:active::after, .d-tonal .chip:active::after, .d-tonal .cday:not(:disabled):active::after, .d-tonal .rli:active::after, .d-tonal .dchip:active::after, .d-tonal .seg button:active::after { opacity: .12; }

.d-tonal .t-r.sc { background: var(--rc); color: var(--onr); }
.d-tonal .t-g.sc { background: var(--gc); color: var(--ong); }
.d-tonal .t-b.sc { background: var(--pc); color: var(--onpc); }

.d-tonal .live { width: 8px; height: 8px; border-radius: 50%; background: var(--gdot); box-shadow: 0 0 0 0 var(--gdot); animation: tonal-live 2s ease-out infinite; }

@media (prefers-reduced-motion: reduce) { .d-tonal .live { animation: none; } }

/* avatars */
.d-tonal .av { width: var(--sz); height: var(--sz); border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  background: color-mix(in oklab, var(--dc) 18%, var(--s0)); color: color-mix(in oklab, var(--dc) 72%, var(--on)); }

.d-tonal .ti { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }

.d-tonal .ti.t-y { background: var(--yc); color: var(--ony); }
.d-tonal .ti.t-b { background: var(--pc); color: var(--onpc); }
.d-tonal .ti.t-g { background: var(--gc); color: var(--ong); }

/* the one stepper */
.d-tonal .stp { list-style: none; margin: 0; padding: 0; display: flex; align-items: flex-start; --d: 12px; }
.d-tonal .stp .st { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.d-tonal .stp .st + .st::before { content: ""; position: absolute; top: calc(var(--d) / 2 - 1px); height: 2px; border-radius: 1px;
  inset-inline-end: calc(50% + var(--d) / 2 + 3px); width: calc(100% - var(--d) - 6px); background: var(--olv); }
.d-tonal .stp .st.lk + .st.lk::before, .d-tonal .stp .st.st-done + .st::before { background: var(--gdot); }
.d-tonal .stp .dot { width: var(--d); height: var(--d); border-radius: 50%; display: grid; place-items: center; position: relative;
  box-shadow: inset 0 0 0 2px var(--olv); color: var(--onv); font-size: 13px; font-weight: 500; }
.d-tonal .stp .st-done .dot { background: var(--gdot); box-shadow: none; color: #fff; }

.d-tonal .stp .st-cur .dot { box-shadow: inset 0 0 0 2px var(--tc), 0 0 0 4px color-mix(in srgb, var(--tc) 22%, transparent); background: var(--s0); }
.d-tonal .stp .st-ret .dot { background: var(--rc); color: var(--onr); box-shadow: inset 0 0 0 2px var(--rdot), 0 0 0 4px color-mix(in srgb, var(--rdot) 22%, transparent); }
.d-tonal .stp.t-y { --tc: var(--ydot); } .d-tonal .stp.t-b { --tc: var(--p); } .d-tonal .stp.t-r { --tc: var(--rdot); } .d-tonal .stp.t-g { --tc: var(--gdot); }
.d-tonal .stp-s { padding: 2px 0; }
.d-tonal .stp-l { --d: 32px; }
.d-tonal .stp-l .dot svg.lucide { width: 18px; height: 18px; }
.d-tonal .stp-l .lbl { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--onv); text-align: center; padding: 0 2px; }
.d-tonal .stp-l .st-cur .lbl, .d-tonal .stp-l .st-ret .lbl { color: var(--on); font-weight: 700; }
.d-tonal .stp-l .st-cur .dot { color: var(--on); }
.d-tonal .stp-c { --d: 36px; }
.d-tonal .stp-c .st + .st::before { background: var(--olv); }
.d-tonal .stp-c .dot { background: var(--pc); color: var(--onpc); box-shadow: none; font-size: 15px; }
.d-tonal .stp-c .st-zero .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--olv); color: var(--ol); }
.d-tonal .stp-c .rbadge { position: absolute; top: -4px; inset-inline-end: -6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--rdot); color: #fff; font-size: 11px; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--card); }

/* lists */

.d-tonal .row { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 72px; padding: 12px 16px; }

/* phone frame */

/* nav bar + FAB */

.d-tonal .fab { position: absolute; bottom: calc(100% + 16px); inset-inline-end: 16px; height: 56px; padding: 0 20px 0 16px; border-radius: 16px; background: var(--pc); color: var(--onpc); display: inline-flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 500; box-shadow: var(--sh3); }

/* flow / stats / misc cards */

  function desktop(c) {
    const counts = stageCounts(c);
    let first = true;
    const rail = c.data.nav
      .map((g, gi) => {
        const items = g.items
          .map((it) => {
            const on = it.key === "home";

  function after(root, c) {
    // Book: tap first day, then last; a closed/booked day in between starts over.
    root.querySelectorAll('.d-tonal[data-screen="book"]').forEach((scr) => {
      let sel = [23, 24];
      let picking = false;
      const days = c.data.calendar.days;
      const paint = () => {
        scr.querySelectorAll(".cday[data-d]").forEach((b) => {
          const d = +b.dataset.d;
          b.classList.remove("sel-a", "sel-b", "sel-m", "sel-one");
          b.removeAttribute("aria-pressed");
          if (d >= sel[0] && d <= sel[1]) {
            b.classList.add(sel[0] === sel[1] ? "sel-one" : d === sel[0] ? "sel-a" : d === sel[1] ? "sel-b" : "sel-m");
            b.setAttribute("aria-pressed", "true");
          }
        });
        const pad = (x) => `2026-10-${String(x).padStart(2, "0")}`;
        const n = sel[1] - sel[0] + 1;
        const out = scr.querySelector("[data-bk-range]");
        if (out) out.textContent = `${c.range(pad(sel[0]), pad(sel[1]))} · ${dayCount(c, n)}`;
      };
      scr.addEventListener("click", (e) => {
        const b = e.target.closest(".cday[data-d]");
        if (!b || b.disabled) return;
        const d = +b.dataset.d;
        if (!picking || d < sel[0]) {
          sel = [d, d];
          picking = true;
        } else {
          let ok = true;
          for (let x = sel[0]; x <= d; x++) if (days[x].status !== "open") ok = false;
          sel = ok ? [sel[0], d] : [d, d];
          picking = !ok;
        }
        paint();
      });
    });
    // Inbox: filter chips.
    root.querySelectorAll('.d-tonal[data-screen="inbox"]').forEach((scr) => {
      scr.addEventListener("click", (e) => {
        const chip = e.target.closest(".chip[data-team]");
        if (!chip) return;
        const team = chip.dataset.team;
        scr.querySelectorAll(".chip[data-team]").forEach((x) => x.setAttribute("aria-pressed", String(x === chip)));
        scr.querySelectorAll(".task[data-team], .row[data-team]").forEach((el) => {
          el.hidden = team !== "all" && el.dataset.team !== team;
        });
      });
    });
  }

  (window.GDG_DESIGNS = window.GDG_DESIGNS || []).push({

        en: "GDG is Google's community, so make the console feel like a Google app: calm Material 3 tonal surfaces seeded from GDG blue, a booking calendar in Google Calendar's grammar (bookings as department-coloured chips, today ringed, the selection a tonal band), a navigation bar with a floating “Book dates” button on phones and a navigation rail on desktop. The four Google colours are used the way Google uses them: for status only.",
      },
      type: { ar: "Google Sans للاتيني و Noto Sans Arabic للعربي، بأدوار Material 3 (عنوان ٢٤، عنوان قائمة ١٦، نص ١٤).", en: "Google Sans for Latin, Noto Sans Arabic for Arabic, on Material 3 type roles (headline 24, title 16, body 14)." },
      nav: { ar: "الجوال: شريط سفلي (الرئيسية، المسار، الفعاليات، المزيد) وزر عائم «احجز موعدًا». سطح المكتب: شريط تنقل جانبي والزر العائم أعلاه.", en: "Phone: bottom navigation bar (Home, Pipeline, Events, More) plus an extended “Book dates” FAB. Desktop: navigation rail with the FAB at the top." },
      why: { ar: "هي لغة أدوات Google اللي يعيش فيها النادي أصلًا (التقويم، النماذج، Gmail) والعلامة اللي يمثلها النادي. ما أحد يحتاج يتعلم شيء، ومكونات Material تغطي كل أنماط الإدارة (جداول، نماذج، نوافذ) اللي يحتاجها باقي التطبيق.", en: "It is the language of the Google tools the club already lives in (Calendar, Forms, Gmail) and the brand the club represents. Nobody has to learn anything, and Material's components cover every admin pattern (tables, forms, dialogs) the rest of the app needs." },
      risk: { ar: "الأكثر ألفة بين الأربعة: يبان كأنه تطبيق Google، وهذا المقصود لنادي GDG، لكنه أيضًا المكان اللي توصل له أغلب التصاميم في هذا النوع. تميّزه يجي من الإتقان والتقويم فقط.", en: "The most familiar of the four: it reads like a Google app, which is the point for a GDG club, but it is also where most designs in this category land. Its distinctiveness comes only from craft and the calendar." },
      palette: [
        { name: { ar: "أساسي", en: "Primary" }, hex: "#0B57D0" },
        { name: { ar: "حاوية أساسية", en: "Primary container" }, hex: "#D3E3FD" },
        { name: { ar: "سطح", en: "Surface" }, hex: "#F8FAFD" },
        { name: { ar: "حاوية سطح", en: "Surface container" }, hex: "#E9EEF6" },
        { name: { ar: "حبر", en: "On surface" }, hex: "#1F1F1F" },

        { ar: "من «الطين والأبواب»: اللون يظهر فقط حيث يعني حالة؛ كل ما عداه أسطح محايدة.", en: "From Mud & Doors: colour appears only where it means state; everything else is tonal neutral." },
