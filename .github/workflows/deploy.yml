name: Deploy

# A push to dev deploys only the half that changed to staging
# (admin-dev.gdg-q.com, Backend/docs/STAGING.md); a push to main, which only ever
# receives dev, does the same to production. Run it by hand on either branch to
# redeploy both halves.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Both deploys replace their directory on the VPS; queue merges instead of overlapping them.
concurrency:
  group: deploy
  cancel-in-progress: false

# Everything that differs between the two deployments. Nothing below may name
# prod or staging directly. Staging runs one worker: it serves a handful of
# developers, and the VPS also carries prod.
env:
  BRANCH: ${{ github.ref_name }}
  INFISICAL_ENV: ${{ github.ref_name == 'dev' && 'staging' || 'prod' }}
  BACKEND_NAME: ${{ github.ref_name == 'dev' && 'GDG-backend-staging' || 'GDG-backend' }}
  BACKEND_PORT: ${{ github.ref_name == 'dev' && '7502' || '7501' }}
  BACKEND_WORKERS: ${{ github.ref_name == 'dev' && '1' || '4' }}
  FRONTEND_DIR: ${{ github.ref_name == 'dev' && 'GDG-admin-frontend-staging' || 'GDG-admin-frontend' }}
  FRONTEND_CONTAINER: ${{ github.ref_name == 'dev' && 'gdg-admin-web-staging' || 'gdg-admin-web' }}
  FRONTEND_PORT: ${{ github.ref_name == 'dev' && '3013' || '3012' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          # Compare with this branch's previous commit. Without it, a push to
          # any branch but the default (dev) is compared with dev, and a push
          # to main - which only ever receives dev - looks unchanged: both
          # halves were skipped on the first promotion (run 37878274507).
          base: ${{ github.ref_name }}
          filters: |
            backend: ["Backend/**", ".github/workflows/deploy.yml"]
            frontend: ["Frontend/**", ".github/workflows/deploy.yml"]

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.INFISICAL_VPS_HOST }}
          username: ${{ secrets.INFISICAL_VPS_USER }}
          key: ${{ secrets.INFISICAL_GITHUB_SSH_PRIVATE_KEY }}
          envs: BRANCH,INFISICAL_ENV,BACKEND_NAME,BACKEND_PORT,BACKEND_WORKERS
          script: |
            set -e
            export PATH="$HOME/.local/bin:/home/ubuntu/.nvm/versions/node/v24.12.0/bin:$PATH"
            NAME=$BACKEND_NAME
            DIR=~/$NAME
            SECRETS="infisical run --env=$INFISICAL_ENV --path=/admin-backend --projectId=300b1e97-7e52-4a4e-872d-053b9082cac5 --silent --"

            source /etc/infisical/prod.env
            INFISICAL_TOKEN=$(infisical login --method="$INFISICAL_AUTH_METHOD" \
              --client-id="$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
              --client-secret="$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" --plain --silent)
            export INFISICAL_TOKEN

            # 1. Build the release next to the live one. Until step 3 the running
            #    app is untouched, so any failure here leaves it serving.
            rm -rf "$DIR.new"
            TMP=$(mktemp -d)
            git clone --depth 1 --branch "$BRANCH" https://github.com/${{ github.repository }}.git "$TMP"
            mv "$TMP/Backend" "$DIR.new"
            rm -rf "$TMP"
            cd "$DIR.new"
            uv sync --locked

            # 2. Migrate this deployment's database to the release's head, then confirm it got there.
            echo "$INFISICAL_ENV is at: $($SECRETS uv run alembic current 2>/dev/null)"
            $SECRETS uv run alembic upgrade head
            $SECRETS uv run alembic current --check-heads

            # 3. Replace the live release and restart. The venv is rebuilt because
            #    its scripts hardcode the directory path.
            rm -rf "$DIR"
            mv "$DIR.new" "$DIR"
            cd "$DIR"
            rm -rf .venv
            uv sync --locked
            pm2 delete $NAME || true
            pm2 start "INFISICAL_TOKEN=$INFISICAL_TOKEN $SECRETS uv run uvicorn app.main:app --port $BACKEND_PORT --host 0.0.0.0 --workers $BACKEND_WORKERS" --name $NAME --time
            pm2 save

            # 4. Smoke test: the app is up, reaches the DB, and a real ORM query works.
            for i in $(seq 30); do
              if curl -fsS -o /dev/null localhost:$BACKEND_PORT/health/db && curl -fsS -o /dev/null localhost:$BACKEND_PORT/events/; then
                echo "Backend is serving ✅"; exit 0
              fi
              sleep 2
            done
            echo "Backend failed its smoke test ❌"
            pm2 logs $NAME --lines 60 --nostream
            exit 1

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.INFISICAL_VPS_HOST }}
          username: ${{ secrets.INFISICAL_VPS_USER }}
          key: ${{ secrets.INFISICAL_GITHUB_SSH_PRIVATE_KEY }}
          envs: BRANCH,INFISICAL_ENV,FRONTEND_DIR,FRONTEND_CONTAINER,FRONTEND_PORT
          script: |
            set -e
            DIR=~/$FRONTEND_DIR

            TMP=$(mktemp -d)
            git clone --depth 1 --branch "$BRANCH" https://github.com/${{ github.repository }}.git "$TMP"
            rm -rf "$DIR"
            mv "$TMP/Frontend" "$DIR"
            rm -rf "$TMP"
            cd "$DIR"

            source /etc/infisical/prod.env
            INFISICAL_TOKEN=$(infisical login --method="$INFISICAL_AUTH_METHOD" \
              --client-id="$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
              --client-secret="$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" --plain --silent)
            export INFISICAL_TOKEN
            infisical export --env=$INFISICAL_ENV --path=/admin-frontend --projectId=300b1e97-7e52-4a4e-872d-053b9082cac5 \
              --format=dotenv --output-file=.env.production

            # The compose project is named after $DIR, so prod and staging never replace each other.
            CONTAINER_NAME=$FRONTEND_CONTAINER HOST_PORT=$FRONTEND_PORT \
              docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
            docker image prune -f
